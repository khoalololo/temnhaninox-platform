server:
  port: 8080

spring:
  profiles:
    default: dev
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: catalog-pricing-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/catalog/**,/api/v1/quotes/**,/api/v1/files/**,/api/v1/admin/catalog/**,/api/v1/admin/pricing/**,/api/v1/admin/files/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/payments/**,/api/v1/admin/orders/**,/api/v1/admin/payments/**,/api/v1/admin/dashboard/**

app:
  jwt:
    secret: ${JWT_SECRET}
