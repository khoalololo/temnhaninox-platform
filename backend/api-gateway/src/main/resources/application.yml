server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: catalog-pricing-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/catalog/**,/api/v1/quotes/**,/api/v1/files/**,/api/v1/admin/catalog/**,/api/v1/admin/pricing/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/payments/**,/api/v1/admin/orders/**,/api/v1/admin/dashboard/**

app:
  jwt:
    secret: ${JWT_SECRET:TemNhanInox2026SuperSecretJwtSigningKeyMustBeAtLeast64BytesLong!}
