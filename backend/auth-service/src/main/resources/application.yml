server:
  port: 8081

spring:
  profiles:
    default: dev
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:temnhaninox_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  flyway:
    enabled: true
    schemas: auth_schema
    default-schema: auth_schema
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # adopt DBs that were bootstrapped by the old init.sql
    baseline-version: "1"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: auth_schema
        format_sql: true

app:
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM:no-reply@temnhaninox.com}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  health:
    mail:
      enabled: false   # do not report the service DOWN just because SMTP is unreachable
  endpoints:
    web:
      exposure:
        include: health,info
