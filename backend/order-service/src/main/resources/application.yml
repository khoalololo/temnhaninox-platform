server:
  port: 8083

spring:
  profiles:
    default: dev
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/temnhaninox_db?currentSchema=order_schema}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: order_schema
    default-schema: order_schema
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # adopt DBs that were bootstrapped by the old init.sql
    baseline-version: "1"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: order_schema
        format_sql: false

app:
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    return-url: ${VNPAY_RETURN_URL:http://localhost:4200/payment/vnpay-return}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
