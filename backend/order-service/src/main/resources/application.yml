server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/temnhaninox_db?currentSchema=order_schema}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: order_schema
        format_sql: false

app:
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMO_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET:DEMO_HASH_SECRET_KEY_1234567890}
    return-url: ${VNPAY_RETURN_URL:http://localhost:4200/payment/vnpay-return}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
